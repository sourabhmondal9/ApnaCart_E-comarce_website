[build]
  publish = "dist"
  command = "npm run build"

# React Router uses client-side routing, so every path must resolve to
# index.html — otherwise refreshing e.g. /products/123 returns a 404
# from Netlify's static file server before React Router ever runs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
